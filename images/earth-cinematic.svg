<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Earth at night seen from space</title>
  <desc id="desc">A cinematic Earth with clouds, city lights, a dark night side and warm orange sunrise.</desc>
  <defs>
    <radialGradient id="ocean" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#9bd7ff"/>
      <stop offset="0.18" stop-color="#347fbd"/>
      <stop offset="0.48" stop-color="#123d73"/>
      <stop offset="0.78" stop-color="#07172f"/>
      <stop offset="1" stop-color="#02050c"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#71825d"/>
      <stop offset="0.45" stop-color="#3c533e"/>
      <stop offset="1" stop-color="#15241e"/>
    </linearGradient>
    <radialGradient id="sunrise" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d8" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#ffc47f" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#ff7d3d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff5f32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmosphere" cx="72%" cy="28%" r="70%">
      <stop offset="0.72" stop-color="#82c9ff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#9bdcff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d8f2ff" stop-opacity="0.86"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00040b" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#00040b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00040b" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="cloud" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="9"/>
      <feColorMatrix values="1 0 0 0 0.85 0 1 0 0 0.9 0 0 1 0 1 0 0 0 .42 0"/>
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="lights" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="planetClip"><circle cx="600" cy="600" r="430"/></clipPath>
    <mask id="cloudMask"><rect width="1200" height="1200" fill="white"/><circle cx="600" cy="600" r="430" fill="white"/></mask>
  </defs>

  <circle cx="975" cy="225" r="235" fill="url(#sunrise)" filter="url(#soft)"/>
  <circle cx="600" cy="600" r="455" fill="#5fb9ff" opacity="0.18" filter="url(#soft)"/>
  <circle cx="600" cy="600" r="440" fill="url(#atmosphere)"/>
  <circle cx="600" cy="600" r="430" fill="url(#ocean)"/>

  <g clip-path="url(#planetClip)">
    <path d="M247 430c73-107 167-172 271-187 65-9 119 14 145 65 20 39 7 83-38 110-41 25-85 27-110 68-28 47-24 103-73 135-58 39-148 18-187-37-32-46-26-104-8-154z" fill="url(#land)"/>
    <path d="M640 207c96 5 210 57 269 144 39 57 25 124-35 160-48 29-112 20-148 69-41 57-20 127-75 168-58 43-145 17-174-47-27-59 4-121 34-170 36-59 45-143 129-195z" fill="url(#land)"/>
    <path d="M275 715c87-60 207-46 268 26 48 57 39 136-19 183-55 44-137 45-194 3-66-49-93-156-55-212z" fill="url(#land)"/>
    <path d="M737 714c58-43 150-35 197 19 37 44 28 108-20 141-47 32-120 23-158-20-41-46-50-105-19-140z" fill="url(#land)"/>

    <rect x="150" y="150" width="900" height="900" filter="url(#cloud)" opacity="0.52"/>

    <g fill="#ffb85c" filter="url(#lights)" opacity="0.92">
      <circle cx="730" cy="405" r="5"/><circle cx="756" cy="430" r="3"/><circle cx="780" cy="455" r="4"/>
      <circle cx="805" cy="482" r="3"/><circle cx="830" cy="512" r="5"/><circle cx="858" cy="545" r="3"/>
      <circle cx="698" cy="470" r="3"/><circle cx="721" cy="510" r="4"/><circle cx="747" cy="552" r="3"/>
      <circle cx="681" cy="610" r="4"/><circle cx="714" cy="642" r="3"/><circle cx="751" cy="675" r="4"/>
      <circle cx="352" cy="532" r="3"/><circle cx="384" cy="558" r="4"/><circle cx="416" cy="585" r="3"/>
      <circle cx="450" cy="622" r="5"/><circle cx="488" cy="654" r="3"/><circle cx="520" cy="690" r="4"/>
    </g>

    <circle cx="600" cy="600" r="430" fill="url(#night)"/>
    <ellipse cx="390" cy="390" rx="330" ry="210" fill="#fff" opacity="0.08" transform="rotate(-25 390 390)"/>
  </g>

  <circle cx="600" cy="600" r="430" fill="none" stroke="#c7eaff" stroke-opacity="0.36" stroke-width="3"/>
  <path d="M888 300a430 430 0 0 1 125 300" fill="none" stroke="#ff9a4d" stroke-width="12" stroke-linecap="round" opacity="0.75" filter="url(#soft)"/>
</svg>
